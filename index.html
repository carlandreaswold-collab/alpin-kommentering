<body>
<header>
  <h1>⛷ Alpin kommentering</h1>
  <div class="seg" id="sSex"></div>
  <div class="seg" id="sDisc"></div>
  <div class="seg" id="sTab"></div>
  <span id="fis" class="fis"></span>
  <span class="sp"></span>
  <input type="search" id="q" placeholder="Søk utøver…  ( / )" list="dl" autocomplete="off">
  <datalist id="dl"></datalist>
</header>
<main id="app"></main>
<script src="data.js?v=20261116102347"></script>
<script>
const D = window.ALPIN_DATA;
/* Resultater lest fra FIS-PDF (foreløpige, lagret i nettleseren). Legges inn blant rennene, men aldri oppå et renn som FIS-dataene allerede har. */
let PRES = {}; try{ PRES = JSON.parse(localStorage.getItem('alpinResults')||'{}'); }catch(e){}
const savePres = ()=>localStorage.setItem('alpinResults', JSON.stringify(PRES));
if(D.wc) for(const p of Object.values(PRES)){
  if(D.wc.races.some(r=>!r.prelim && r.sex===p.sex && r.disc===p.disc && r.date===p.date)) continue;   // FIS har det offisielle: det gjelder
  D.wc.races.push(p);
}
const SEX = {K:'Kvinner', M:'Menn'};
const DISC = {SL:'Slalåm', GS:'Storslalåm', FART:'Fart (SG/DH)'};
const NOW = '26/27', PREV = '25/26';
const S = Object.assign({sex:'M', disc:'SL', tab:'kort', id:null, race:null, season:NOW}, JSON.parse(localStorage.getItem('alpinState')||'{}'));
const byId = Object.fromEntries(D.athletes.map(a=>[a.id,a]));
const esc = s => String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const save = () => localStorage.setItem('alpinState', JSON.stringify(S));
const noteKey = (a)=>'alpinNote:'+a.id+':'+S.disc;
const oldNoteKey = (a)=>'alpinNoteOld:'+a.id+':'+S.disc;
const histKey = (a)=>'alpinNoteHist:'+a.id+':'+S.disc;   // forrige versjoner av notatet (maks 20), for «Angre»
const getHist = (a)=>{ try{ return JSON.parse(localStorage.getItem(histKey(a))||'[]'); }catch(e){ return []; } };   // dine redigerte gamle notater (originalen fra arket ligger urørt i data.js)

/* ---------- Innlimte startlister (FIS-PDF) ----------
   LISTS: {id: {sex, disc, label, run, e:[{bib, id, g?:{name,land,alder}}]}}  (localStorage 'alpinLists')
   S.src['K'+'SL'] = id for aktiv liste, ellers arkets startnummer. */
let LISTS = JSON.parse(localStorage.getItem('alpinLists')||'{}');
const saveLists = ()=>localStorage.setItem('alpinLists', JSON.stringify(LISTS));
function ensureGuests(){   // utøvere som ikke finnes i basen får et enkelt midlertidig kort
  for(const L of Object.values(LISTS)) for(const x of L.e) if(x.g && !byId[x.id]){
    const a={id:x.id,sex:L.sex,name:x.g.name,land:x.g.land,alder:x.g.alder,start:{},info:{},notes:{},news:'',results:[],fid:null,pod:null,aktiv:true,gjest:true};
    D.athletes.push(a); byId[a.id]=a;
  }
}
ensureGuests();
function activeList(){ const k=(S.src||{})[S.sex+S.disc]; return k && LISTS[k] ? LISTS[k] : null; }
function bibOf(a){
  const L=activeList();
  if(L){ const x=L.e.find(y=>y.id===a.id); return x?x.bib:undefined; }
  return (a.start[NOW]||{})[S.disc];
}
function listEx(a){ const L=activeList(); const x=L&&L.e.find(y=>y.id===a.id); return x&&x.ex; }
function exText(a){ const e=listEx(a); if(!e) return ''; return ` · <span style="color:var(--gul)">omg 1: startnr ${e.b1}${e.t1?', tid '+e.t1:''}${e.d1?' (+'+e.d1+')':''}${e.r1?', plass '+e.r1:''}</span>`; }
function startList(){
  const L=activeList();
  if(L) return L.e.map(x=>byId[x.id]).filter(Boolean);
  return D.athletes.filter(a=>a.sex===S.sex && a.start[NOW] && a.start[NOW][S.disc]!=null)
    .sort((a,b)=>a.start[NOW][S.disc]-b.start[NOW][S.disc]);
}

/* --- lesing av FIS-startliste (tekst kopiert fra PDF) --- */
const _tr = s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ø/g,'o').replace(/æ/g,'ae').replace(/ß/g,'ss').replace(/đ/g,'d').replace(/ł/g,'l');
const _tok = s=>_tr(s).replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean);
const _tok2 = s=>_tok(s).map(t=>t.replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u').replace(/aa/g,'a'));
function parseStartList(text){
  const entries=[], bad=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.replace(/\s+/g,' ').trim();
    // omgang 2: «startrekkefølge bib FIS-kode NAVN år LAND tid1 [diff] plass1 ski»
    const m2=line.match(/^(\d{1,3}) (\d{1,3}) (\d{4,8}) (.+?) (\d{4}) ([A-Z]{3})(?: ([\d:]+\.\d{2})(?: (\d+\.\d{2}))? (\d{1,3}))?(?: .*)?$/);
    const m=line.match(/^(\d{1,3}) (\d{4,8}) (.+?) (\d{4}) ([A-Z]{3})(?: .*)?$/);
    if(m2 && +m2[5]>1950 && +m2[5]<2015){
      entries.push({bib:+m2[1], code:m2[3], raw:m2[4], year:+m2[5], land:m2[6], ex:{b1:+m2[2], t1:m2[7]||'', d1:m2[8]||'', r1:m2[9]?+m2[9]:null}});
    } else if(m && +m[4]>1950 && +m[4]<2015){
      // FIS skriver ETTERNAVN (store bokstaver) først, deretter fornavn
      entries.push({bib:+m[1], code:m[2], raw:m[3], year:+m[4], land:m[5]});
    } else if(/^\d{1,3} \d{4,8} /.test(line)) bad.push(line);
  }
  const t=text;
  const info={};
  info.sex = /\b(Women|Ladies)/i.test(t)?'K':/\bMen'?s\b/i.test(t)?'M':null;   // «Women's» inneholder «men's»: kvinner testes først
  info.disc = /Giant Slalom/i.test(t)?'GS':/Slalom/i.test(t)?'SL':/Super.?G|Downhill|Combined/i.test(t)?'FART':null;
  const r=t.match(/START LIST RUN (\d)/i)||t.match(/RUN (\d)/i); info.run=r?+r[1]:null;
  const pl=t.match(/^\s*(.+?) \(([A-Z]{3})\)\s*$/m); info.place=pl?pl[1].split(/\s{3,}/).pop().replace(/^AUDI.*$/,'').trim():'';   // OCR kan gi «logo-tekst    Sölden»: ta siste del
  const dt=t.match(/\b(?:MON|TUE|WED|THU|FRI|SAT|SUN) (\d{1,2}) ([A-Z]{3}) (\d{4})/); info.date=dt?`${dt[1]}. ${dt[2].toLowerCase()}`:'';
  const nc=t.match(/Number of Competitors: (\d+)/i); info.expected=nc?+nc[1]:null;
  return {entries, bad, info};
}
/* ---------- Resultatliste fra FIS-PDF (RESULTS RUN 1 / RESULTS) ----------
   Ren logikk (parseResults + checkResults), testes i tests/. Resultatene regnes ikke som kontrollert mot FIS før FIS-henting har bekreftet dem. */
const _hs = s=>{ const m=String(s).match(/^(?:(\d+):)?(\d{1,2})\.(\d{2})$/); return m?(+(m[1]||0))*6000+(+m[2])*100+(+m[3]):null; };   // «1:52.62» → 11262 (hundredeler)
const _MON={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
function parseResults(text){
  const L=text.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const T='(\\d+:\\d\\d\\.\\d\\d|\\d+\\.\\d\\d)';
  const RF=new RegExp('^(\\d+) (\\d{1,3}) (\\d{4,8}) (.+?) (\\d{4}) ([A-Z]{3}) '+T+' \\((\\d+)\\) '+T+' \\((\\d+)\\) '+T+' (\\d+\\.\\d\\d)(?: (\\d+\\.\\d\\d))?(?: (.*))?$');   // to omganger
  const RS=new RegExp('^(\\d+) (\\d{1,3}) (\\d{4,8}) (.+?) (\\d{4}) ([A-Z]{3}) '+T+'(?: (\\d+\\.\\d\\d))?(?: (\\d+\\.\\d\\d))?(?: (.*))?$');            // én omgang / omgang 1-listen
  const SR=new RegExp('^(\\d{1,3}) (\\d{4,8}) (.+?) (\\d{4}) ([A-Z]{3})(?: '+T+' \\((\\d+)\\))?(?: (.*))?$');                                           // uten plass: DNF/DNQ/DNS/DSQ
  const LOOKS=/^\d{1,3} (?:\d{1,3} )?\d{4,8} .+ \d{4} [A-Z]{3}\b/;
  const S={run1:{list:[],dnf1:[],dns:[],dsq:[]}, fin:{list:[],dnf1:[],dnf2:[],dnq:[],dns:[],dsq:[]}};
  const R={s:S, bad:[], heads:{run1:{},fin:{}}, info:{}, cond:{}, tech:{}};
  let sec=null, sub=null, m;
  for(const l of L){
    if(/^RESULTS RUN 1$/i.test(l)){ if(sec!=='run1') sub=null; sec='run1'; continue; }
    if(/^RESULTS$/i.test(l)){ if(sec!=='fin') sub=null; sec='fin'; continue; }
    if(/^(START LIST|DRAW LIST|ENTRY LIST|PERFORMANCE ANALYSIS|FIS WORLD CUP STANDINGS|OVERALL|FIS WCSL|CONSTRUCTORS|FIS NATION|FIS WC)/i.test(l)){ sec=null; sub=null; continue; }
    if(/^(Jury Technical Data|Legend:|TOTALS:)/i.test(l)){ sec=null; sub=null; }
    // --- overskrifter/metadata ---
    if(!R.info.sex && (m=l.match(/\b(Women'?s|Ladies|Men'?s)\b (Giant Slalom|Slalom|Super-?G|Downhill|Alpine Combined)/i))){
      R.info.sex=/^(Women|Ladies)/i.test(m[1])?'K':'M';
      const d=m[2].toLowerCase(); R.info.disc=d==='giant slalom'?'GS':d==='slalom'?'SL':/^super/.test(d)?'SG':d==='downhill'?'DH':'AC';

async function pdfToText(buf){   // leser PDF i nettleseren (pdf.js i vendor/); bygger linjer ut fra posisjon på siden
  const pdfjs=await import('./vendor/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc='./vendor/pdf.worker.min.mjs';
  const doc=await pdfjs.getDocument({data:new Uint8Array(buf),isEvalSupported:false,disableFontFace:true,useSystemFonts:false}).promise;
  const pages=[];
  for(let n=1;n<=doc.numPages;n++){
    const tc=await (await doc.getPage(n)).getTextContent();
    const it=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0}));
    it.sort((a,b)=>b.y-a.y||a.x-b.x);
    const lines=[]; let cur=null;
    for(const i of it){ if(!cur||Math.abs(i.y-cur.y)>2.5){ cur={y:i.y,items:[]}; lines.push(cur); } cur.items.push(i); }
    pages.push(lines.map(l=>{ l.items.sort((a,b)=>a.x-b.x); let t='',end=null;
      for(const i of l.items){ t+=(end!==null && i.x-end>1 ? ' ' : (end!==null?'':''))+i.s; end=i.x+i.w; }
      return t.replace(/\s+/g,' ').trim(); }).join('\n'));
  }
  return pages.join('\n');
}

/* OCR-RENS-START (ren logikk, testes i tests/ocr_rens_test.mjs) */
const NSA='AUT ITA SUI GER FRA NOR SWE USA CAN SLO CRO CZE SVK POL FIN ESP AND GBR BEL NED DEN AUS NZL JPN KOR CHN BUL ROU HUN LTU LAT EST UKR TUR ARG CHI BRA BIH SRB MKD GRE ISL LIE LUX MON KAZ ISR IRL LBN IND MEX COL PER RSA ARM GEO AZE MDA ALB KOS BLR RUS HKG TPE UZB'.split(' ');
function lev1(a,b){   // editeringsavstand høyst 1
  if(a===b) return true; if(Math.abs(a.length-b.length)>1) return false;
  let i=0; while(i<a.length&&i<b.length&&a[i]===b[i]) i++;
  if(a.length===b.length) return a.slice(i+1)===b.slice(i+1);
  const [sm,lg]=a.length<b.length?[a,b]:[b,a]; return sm.slice(i)===lg.slice(i+1);
}
const FORVEKSLES=['IL','I1','L1','CG','O0','DO','QO','S5','B8','EF','T7','UV','MN','Z2','A4','RK','HN'];   // tegn OCR ofte blander
const _lik=(t,k)=>t.length===k.length&&[...t].some((c,i)=>c!==k[i]&&FORVEKSLES.some(p=>(p[0]===c&&p[1]===k[i])||(p[1]===c&&p[0]===k[i])));
function fixLand(tok,codes){   // «Sul»→SUI, «'CER.»→GER: bare når én kjent kode ligner, og ved flere treff bare hvis én bruker en vanlig OCR-forveksling
  const t=tok.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  if(t.length===3&&codes.has(t)) return t;
  let c=[...codes].filter(k=>lev1(t,k));
  if(c.length>1){ const v=c.filter(k=>_lik(t,k)); if(v.length) c=v; }
  return c.length===1?c[0]:(/^[A-Z]{3}$/.test(t)?t:tok);
}
const OCR_RAD=/(?:(\d{1,3}) +)?(\S{1,3}) +(\d{4,8}) +(.+?) +((?:19|20)\d\d) +(\S{2,5})(?=\s|$)/;
const _num=x=>/^\d{1,3}$/.test(x)?+x:null;
function ocrClean(t,codes){   // støy foran startnummer kastes, landskode rettes, feillest startnummer rettes ut fra naboene
  codes=codes||new Set(NSA);
  const out=t.split('\n').map(line=>{
    const l=line.replace(/\s+/g,' ').trim(), m=OCR_RAD.exec(l);
    if(!m) return {raw:line};
    return {row:true,start:m[1]!==undefined,pre:m[1]!==undefined?m[1]+' ':'',bib:m[2],code:m[3],name:m[4],year:m[5],land:fixLand(m[6],codes),rest:l.slice(m.index+m[0].length).trim()};
  });
  const R=out.filter(o=>o.row&&!o.start); let prev=null;
  R.forEach((o,q)=>{
    const b=_num(o.bib), nb=R[q+1]?_num(R[q+1].bib):null;
    if(prev===null){ if(b===null&&nb!==null){ o.bib=String(nb-1); prev=nb-1; } else prev=b; return; }
    const exp=prev+1;
    if(b!==exp && (nb===exp+1 || (!R[q+1]&&(b===null||b<=prev)))){ o.bib=String(exp); prev=exp; } else prev=b!==null?b:exp;
  });
  return out.map(o=>o.row?`${o.pre}${o.bib} ${o.code} ${o.name} ${o.year} ${o.land}${o.rest?' '+o.rest:''}`:o.raw).join('\n');
}
const _isRad=l=>/^(\d{1,3} )?\d{1,3} \d{4,8} /.test(l);
const _key=l=>{ const w=l.split(' '); return (/^\d{1,3}$/.test(w[1])&&/^\d{4,8}$/.test(w[2])&&!/^\d{4,8}$/.test(w[1])?w[0]+'|'+w[1]+'|'+w[2]:w[0]+'|'+w[1]); };
function mergeOcr(a,b){   // slår sammen to OCR-tekster: samme rad (startnr + FIS-kode) tas bare én gang, radene sorteres etter startnummer
  const lines=[...a.split('\n'),...b.split('\n')], head=[], rows=[], seen=new Set();
  for(const l of lines){ if(_isRad(l)){ const k=_key(l); if(!seen.has(k)){ seen.add(k); rows.push(l); } } else head.push(l); }
  rows.sort((x,y)=>parseInt(x)-parseInt(y));
  return head.join('\n')+'\n'+rows.join('\n');
}
function ocrHoles(t){   // startnumre som mangler mellom første og siste leste
  const b=t.split('\n').filter(_isRad).map(l=>parseInt(l)).filter(n=>n>0).sort((x,y)=>x-y), h=[];
  for(let k=1;k<b.length;k++) for(let n=b[k-1]+1;n<b[k];n++) h.push(n);
  return h;
}
/* OCR-RENS-SLUTT */
let _pool=[];
const ocrStat=t=>{ const e=document.getElementById('ocrstat'); if(e) e.textContent=t; };
function loadScript(src){ return new Promise((ok,no)=>{ const e=document.createElement('script'); e.src=src; e.onload=ok; e.onerror=()=>no(new Error('Fant ikke '+src)); document.head.appendChild(e); }); }
const withTimeout=(p,ms,msg)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error(msg)),ms))]);
async function makeOcrWorker(){   // ren JS-versjon (asm.js): nrk-stash tillater ikke WebAssembly
  if(!window.Tesseract) await loadScript('./vendor/ocr/tesseract.min.js');
  const w=Tesseract.createWorker({
    workerPath:'./vendor/ocr/worker.min.js', corePath:'./vendor/ocr/tesseract-core.asm.js', langPath:'./vendor/ocr', gzip:true, workerBlobURL:false,
    logger:m=>{ if(m.status&&m.status!=='recognizing text') ocrStat('Gjør klar tekstgjenkjenning…'); },

    await withTimeout((async()=>{ await w.load(); await w.loadLanguage('eng'); await w.initialize('eng'); await w.setParameters({tessedit_pageseg_mode:'6', preserve_interword_spaces:'1'}); })(),90000,'Tekstgjenkjenningen kom ikke i gang (timeout). Bruk PDF eller lim inn tekst i stedet.');

const nsaCodes=()=>new Set([...NSA,...((typeof D!=='undefined'&&D.athletes)||[]).map(a=>a.land).filter(Boolean)]);
async function imageToCanvas(file,width){   // retter opp mobilfotoets rotasjon og skalerer til gitt bredde (ikke kontraststrekk: det ga dårligere lesing ved gjenskinn)
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  const k=Math.max(0.3,Math.min(2.5,(width||2000)/bmp.width));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);

}
async function ocrOne(w,file){
  const run=async width=>ocrClean((await withTimeout(w.recognize(await imageToCanvas(file,width)),240000,'Det tok for lang tid å lese bildet (timeout).')).data.text,nsaCodes());

async function imagesToText(files){

  await Promise.all(pool.map(async w=>{ while(next<files.length){ const i=next++; res[i]=await ocrOne(w,files[i]); done++; stat(); } }));

const isImageFile=f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i.test(f.name||'');
async function importFiles(files){
  S.tab='kort'; IMP={open:true,text:'',busy:true,queue:[]}; render();

    const items=[];

  const M=matchEntries(resultEntries(R),sex), rr=resultRows(R,M), C=checkResults(R);
  if(rr.skipped.length) C.warn.push(`${rr.skipped.length} utøvere finnes ikke som kort i basen og er ikke lagt inn: ${rr.skipped.slice(0,6).join(', ')}${rr.skipped.length>6?' …':''}`);
  const lik=M.filter(x=>x.a&&x.how==='lik navn'); if(lik.length) C.warn.push('Lik stavemåte, sjekk at det er riktig person: '+lik.map(x=>prettyName(x.raw)+' → '+x.a.name).join('; '));
  const lm=M.filter(x=>x.landMismatch); if(lm.length) C.warn.push('Land stemmer ikke med kortet for: '+lm.slice(0,5).map(x=>prettyName(x.raw)).join(', '));
  const am=M.filter(x=>x.ambiguous); if(am.length) C.warn.push('Flere mulige kort for: '+am.slice(0,5).map(x=>prettyName(x.raw)).join(', '));
  const _cmp=(R.info.sex&&R.info.disc&&R.info.date)?compareWithFis(R.info,rr.rows):null;
  if(!C.err.length && R.info.date){ const cv=cupVsPdf(text,R.info,rr.rows,M,_cmp?null:{sex:R.info.sex,season:seasonOf(R.info.date),disc:R.info.disc,date:R.info.date,res:rr.rows,prelim:1}); C.ok.push(...cv.ok); C.warn.push(...cv.warn); }
  IMP.kind='res'; IMP.res=null; IMP.text=text; IMP.error=null;
  IMP.rr={R,M,rr,C,sex,cmp:(R.info.sex&&R.info.disc&&R.info.date)?compareWithFis(R.info,rr.rows):null};
  render();
}
function useResults(){
  const {R,rr,C,cmp}=IMP.rr, I=R.info;
  if(C.err.length||cmp||!rr.rows.length) return;
  const id='P'+I.date+I.sex+I.disc, again=!!PRES[id];
  PRES[id]={id,date:I.date,sex:I.sex,disc:I.disc,place:I.place,nat:I.nat||'',season:seasonOf(I.date),prelim:1,t:Date.now(),file:IMP.fileName||'',res:rr.rows,x:{tech:R.tech,cond:R.cond}};
  savePres();
  S.tab='arkiv'; S.sex=I.sex; S.disc=grp(I.disc); S.season=PRES[id].season; S.rid=id; S.id=null;
  const rest=IMP.queue||[]; IMP=null; save();
  if(again){ location.reload(); return; }   // samme renn lest på nytt: last siden på nytt så gamle rader ikke blir liggende
  liveAdd(PRES[id]);
  if(rest.length){ IMP={open:true,queue:rest}; nextImport(); return; }
  render();
}

function useImport(){

  if(!R.m.length || (C.err.length && !(document.getElementById('iforce')||{}).checked)) return;
  const sex=IMP.sex, disc=IMP.disc, run=IMP.run;
  const label=(document.getElementById('ilabel').value.trim()||'Innlimt liste');
  for(const [k,L] of Object.entries(LISTS)) if(L.sex===sex&&L.disc===disc&&L.run===run&&L.label===label) delete LISTS[k];   // samme liste limt inn på nytt erstatter den gamle
  const id='L'+Date.now();
  LISTS[id]={sex,disc,run,label,t:Date.now(),e:buildListEntries(R.m,sex)};
  saveLists(); ensureGuests();
  S.src=S.src||{}; S.sex=sex; S.disc=disc; S.src[sex+disc]=id; S.id=null;
  const rest=IMP.queue||[]; IMP=null;
  if(rest.length){ IMP={open:true,queue:rest}; nextImport(); return; }   // neste fil i køen
  render();
}

const CD = {SL:'Slalåm', GS:'Storslalåm', SG:'Super-G', DH:'Utfor', AC:'Kombinasjon'};
function techLine(r){
  const x=r.x||{}, t=x.tech||{}, c=x.cond||{}; const bits=[];
  if(t.course) bits.push('Løype: '+esc(t.course)+(t.start?` · ${t.start}→${t.finish} m, ${t.drop} m fall`:''));
  if(t.gates) bits.push('Porter: '+t.gates.filter(Boolean).map((g,i)=>'omg '+(i+1)+' '+g).join(', '));
  for(const k of Object.keys(c)) bits.push(`omg ${k}: ${esc(String(c[k].sky).toLowerCase())}, snø ${esc(String(c[k].snow).toLowerCase())}, ${c[k].ts}/${c[k].tf} °C (start/mål)`);

}

  const r=inCh.find(x=>x.disc===S.cd);
  const rows=r?r.res.map(([fid,v,t,r1,r2])=>({a:fidToAth[fid],v,t,r1,r2})).filter(x=>x.a):[];
  rows.sort((p,q)=>{const pn=num(p.v),qn=num(q.v); return pn&&qn?p.v-q.v : pn?-1 : qn?1 : String(p.v).localeCompare(String(q.v))});
  const medals=rows.filter(x=>num(x.v)&&x.v<=3);
  return `<div class="card arkiv">
    <div class="seg" id="sCh">${keys.map(k=>`<button data-ch="${k}" class="${k===S.ch?'on':''}">${k}</button>`).join('')}</div>
    <div class="races">${ds.map(d=>`<button data-cd="${d}" class="${d===S.cd?'on':''}">${CD[d]}</button>`).join('')}</div>
    ${r?`<h2 style="margin:6px 0">${S.ch} · ${CD[S.cd]} · ${SEX[S.sex]} · ${esc(r.place)} (${esc(r.nat)}) · ${r.date}</h2>
    <div class="chips" style="margin-bottom:10px">${medals.map(x=>`<div class="chip ${x.v===1?'p1':'pod'}" style="font-size:15px"><b>${x.v===1?'🥇':x.v===2?'🥈':'🥉'} ${esc(x.a.name)}</b><i>${esc(x.a.land||'')}</i></div>`).join('')}</div>
    <table><tr><th class="r">Plass</th><th>Utøver</th><th>Land</th>${timeHead(r)}</tr>
    ${rows.map(x=>`<tr class="${x.a.aktiv?'go':'inakt'}${x.v>=1&&x.v<=3?' p'+x.v:''}"${x.a.aktiv?` data-id="${x.a.id}"`:' title="Ikke aktiv utøver"'}><td class="r">${esc(String(x.v).replace(/^DNF\d$/,'DNF'))}</td><td>${esc(x.a.name)}</td><td>${esc(x.a.land||'')}</td>${timeCells(x,r)}</tr>`).join('')}</table>
    <p class="note">Full resultatliste fra FIS. Lagkonkurranser og parallell er ikke med. Klikk et blått navn (aktive utøvere) for å åpne kortet.</p>`:'<p class="note">Ingen mesterskapsdata.</p>'}
  </div>`;
}
function nytt(){
  const M=D.monitor; if(!M) return '<div class="card">Ingen monitordata.</div>';
  const nm=id=>{const a=byId[id];return a?`<a class="mnm" data-id="${a.id}">${esc(a.name)}</a>`:''};
  return `<div class="card nytt"><h2 style="margin:0 0 4px">Sesongstart 2026/27: endringer i sirkuset</h2>
    <p class="note">Fra Alpin Monitor, oppdatert ${esc(M.oppdatert)}. Resultater fra Sölden er sjekket mot FIS. Klikk et navn for å åpne kortet.</p>
    ${M.panel.map(s=>`<div class="box"><h3>${esc(s.tittel)}</h3>${(s.fast_rekkefolge?s.punkter:s.punkter.slice().sort((p,q)=>q.dato.localeCompare(p.dato))).map(p=>`<div class="feed"><small>${esc(p.dato)} · ${esc(p.kilde)}</small><br>${esc(p.tekst)}${p.ids.length?' <small>→ '+p.ids.map(nm).join(', ')+'</small>':''}</div>`).join('')}</div>`).join('')}
  </div>`;
}
function render(){
  chrome(); save();
  app.innerHTML = S.tab==='kort'?kort():S.tab==='arkiv'?arkiv():S.tab==='cup'?cupTab():S.tab==='nytt'?nytt():medalje();
  if(S.tab==='arkiv'){ const ss=[...new Set(((D.wc&&D.wc.races)||[]).map(r=>r.season))].sort().reverse(); seg(document.getElementById('sSeason'),Object.fromEntries(ss.map(x=>[x,'Sesong '+x])),S.season,k=>{S.season=k;S.rid=null;render()}); }
  if(S.tab==='cup') seg(document.getElementById('sCup'),CUPS,S.cup||'ALL',k=>{S.cup=k;S.showAllCup=false;render()});
  const ont=document.getElementById('ont'); if(ont){ const a=byId[S.id]; let committed=ont.value;
    ont.oninput=()=>localStorage.setItem(oldNoteKey(a),ont.value);
    ont.onchange=()=>{ if(ont.value===committed) return; const h=getHist(a); h.push(committed); localStorage.setItem(histKey(a),JSON.stringify(h.slice(-20))); committed=ont.value;
      const el=document.getElementById('ohist'); if(el){ const n=Math.min(h.length,20); el.innerHTML=`<a id="oundo" style="cursor:pointer;text-decoration:underline">↩ Angre siste endring</a> (${n} tidligere versjon${n>1?'er':''})`; } }; }
  const l=document.querySelector('.list .it.on'); if(l) l.scrollIntoView({block:'center'});
  document.querySelectorAll('.spk-scroll').forEach(e=>{ e.scrollLeft=e.scrollWidth; });   // formkurven starter ved de nyeste rennene
}
function step(d){
  const L=startList(); if(!L.length) return;
  let i=L.findIndex(a=>a.id===S.id); i=Math.max(0,Math.min(L.length-1,i+d)); S.id=L[i].id; render();
}
// dra formkurven sidelengs med musa
let drag=null;
app.addEventListener('pointerdown',e=>{ const sc=e.target.closest('.spk-scroll,.gardin'); if(!sc||e.pointerType==='touch') return; drag={sc,x:e.clientX,l:sc.scrollLeft,moved:false}; sc.classList.add('drar'); });
window.addEventListener('pointermove',e=>{ if(drag){ drag.sc.scrollLeft=drag.l-(e.clientX-drag.x); if(Math.abs(e.clientX-drag.x)>5) drag.moved=true; } });
let justDragged=false;
window.addEventListener('pointerup',()=>{ if(drag){ justDragged=drag.moved; setTimeout(()=>justDragged=false,0); drag.sc.classList.remove('drar'); drag=null; } });
window.addEventListener('paste',e=>{   // lim inn selve PDF-filen (kopiert i Filutforsker/Finder) eller et skjermbilde-/filutklipp
  const fs=[...((e.clipboardData&&e.clipboardData.files)||[])];
  if(fs.length){ e.preventDefault(); importFiles(fs); return; }
  if(e.target.id==='itext') setTimeout(readImport,50);
});
app.addEventListener('change',e=>{
  if(['isex','idisc','irun'].includes(e.target.id)){ impChanged(e.target.id,e.target.value); return; }
  if(e.target.id==='ilabel'){ IMP.label=e.target.value; IMP.labelEdited=true; return; }
  if(e.target.id==='pfile'){ const fs=[...e.target.files]; if(fs.length) importFiles(fs); return; }
  if(e.target.id==='iforce'){ document.getElementById('iuse').disabled=!e.target.checked; return; }
  if(e.target.id==='bfile'){ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const r=applyBackup(JSON.parse(t)); alert(`Hentet inn: ${r.lister} nye lister, ${r.notater} notater`+(r.konflikter?`. ${r.konflikter} notater ble ikke overskrevet fordi du har skrevet noe nytt der.`:'.')); localStorage.setItem('alpinBackupT',String(Date.now())); render(); }catch(err){ alert('Kunne ikke hente inn: '+err.message); } }); return; } if(e.target.id==='fven'){ S.ven=S.ven||{}; S.ven[S.sex+'|'+S.disc]=e.target.value; save(); render(); return; } if(e.target.id==='lsel'){ S.src=S.src||{}; S.src[S.sex+S.disc]=e.target.value; S.id=null; render(); } });
app.addEventListener('click',e=>{
  const sp=e.target.closest('[data-sp]'); if(sp){ const sc=app.querySelector('.spk-scroll'); if(sc) sc.scrollBy({left:+sp.dataset.sp*sc.clientWidth*0.8,behavior:'smooth'}); return; }
  const dd=e.target.closest('[data-d]'); if(dd){e.preventDefault();S.disc=dd.dataset.d;render();return}
  if(e.target.closest('[data-allpods]')){S.allPods=!S.allPods;render();return}
  const chb=e.target.closest('[data-ch]'); if(chb){S.ch=chb.dataset.ch;render();return}
  const cdb=e.target.closest('[data-cd]'); if(cdb){S.cd=cdb.dataset.cd;render();return}
  const sc=e.target.closest('[data-sc]'); if(sc){S.scope=sc.dataset.sc;render();return}
  if(e.target.id==='ppick'){ document.getElementById('pfile').click(); return; }
  if(e.target.id==='pphoto'||e.target.id==='lfoto'){   // egen filvelger som viser bilder og PDF (ikke sikkerhetskopi-filtreringen)
    const f=document.createElement('input'); f.type='file'; f.accept=(e.target.id==='lfoto')?'image/*':'image/*,application/pdf,.pdf'; f.multiple=true;
    f.onchange=()=>{ const fs=[...f.files]; if(fs.length) importFiles(fs); };
    f.click(); return;
  }
  if(e.target.id==='oundo'){ const a=byId[S.id]; const h=getHist(a); if(h.length){ const v=h.pop(); localStorage.setItem(oldNoteKey(a),v); localStorage.setItem(histKey(a),JSON.stringify(h)); render(); } return; }
  if(e.target.id==='bsave'){ doBackup(); return; }
  if(e.target.id==='brest'){ document.getElementById('bfile').click(); return; }
  if(e.target.id==='limp'){ IMP=IMP&&IMP.open?null:{open:true,text:''}; render(); return; }
  if(e.target.id==='icancel'){ IMP=null; render(); return; }
  if(e.target.id==='iread'){ readImport(); return; }
  if(e.target.id==='iuse'){ useImport(); return; }
  const cb=e.target.closest('[data-cup]'); if(cb){ S.cup=cb.dataset.cup; S.tab='cup'; S.showAllCup=false; render(); return; }
  if(e.target.id==='cupall'){ S.showAllCup=!S.showAllCup; render(); return; }
  const dr=e.target.closest('[data-delres]'); if(dr){ if(confirm('Fjerne det foreløpige PDF-resultatet fra denne nettleseren?')){ delete PRES[dr.dataset.delres]; savePres(); S.rid=null; save(); location.reload(); } return; }
  if(e.target.id==='ldel'){ const k=S.src[S.sex+S.disc]; if(k&&confirm('Slette listen «'+LISTS[k].label+'»?')){ delete LISTS[k]; S.src[S.sex+S.disc]='ark'; saveLists(); S.id=null; render(); } return; }
  if(e.target.id==='bp') return step(-1);
  if(e.target.id==='bn') return step(1);
  const it=e.target.closest('[data-id]'); if(it){ S.id=it.dataset.id; const a=byId[S.id]; S.sex=a.sex;
    S.tab='kort'; render(); return }
  const cx=e.target.closest('[data-cx]'); if(cx){ S.cupOpen = S.cupOpen===cx.dataset.cx ? null : cx.dataset.cx; render(); return; }
  const go=e.target.closest('[data-goto]'); if(go){ if(justDragged) return;
    const rc=((D.wc&&D.wc.races)||[]).find(x=>x.id===go.dataset.goto); if(!rc) return;
    S.tab='arkiv'; S.sex=rc.sex; S.disc=(rc.disc==='CE'||rc.disc==='PAR')?'SL':grp(rc.disc); S.season=rc.season; S.rid=rc.id; render();
    const row=document.querySelector(`tr[data-id="${go.dataset.aid}"]`); if(row){ row.classList.add('hl'); row.scrollIntoView({block:'center'}); } else window.scrollTo(0,0);
    return; }
  const r=e.target.closest('[data-r]'); if(r){S.rid=r.dataset.r;render()}
});
document.addEventListener('keydown',e=>{
  const t=e.target.tagName;
  if(e.key==='/' && t!=='INPUT' && t!=='TEXTAREA'){e.preventDefault();q.focus();return}
  if(t==='INPUT'||t==='TEXTAREA'||S.tab!=='kort') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();step(1)}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();step(-1)}
});
q.addEventListener('change',()=>{
  const v=q.value.trim().toLowerCase(); if(!v) return;
  const c=D.athletes.filter(a=>a.sex===S.sex&&a.name.toLowerCase().includes(v));
  const a=c.find(a=>a.name.toLowerCase()===v)||c[0]; if(!a) return;
  if(startnr(a)==null){ const d=Object.keys(a.start[NOW]||{})[0]; if(d) S.disc=d; }
  S.id=a.id;S.tab='kort';q.value='';q.blur();render()
});
/* ---------- Hent fra FIS (vei 2): virker bare når siden åpnes fra server.py. På stash/GitHub/file:// vises ingenting. ---------- */
let API=null, LOADV=null;
const hhmm = t=>{ const d=new Date(t*1000); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function fisUI(){
  const el=document.getElementById('fis'); if(!el) return;
  if(!API){ el.innerHTML=''; return; }
  const L=API.last, k=(L&&L.kontroll)||{};
  const ny = LOADV!=null && API.dataVersion!==LOADV;
  const kont = L&&L.ok&&k.rader ? ` · kontroll: ${k.rader.toLocaleString('nb-NO')} rader, ${k.feil||0} feil${k.cuptall?`, cupstilling ${k.cuptall} tall mot FIS, ${k.cupfeil||0} feil`:''}` : '';
  const stat = API.running ? `<span>⏳ ${esc(API.step||'Henter…')}${API.kilde==='auto'?' (auto)':''}</span>`
    : L ? `<span class="${L.ok?'goodt':'bad'}" title="${esc((L.logg||[]).slice(-6).join('\n'))}">${L.ok?'✓':'⛔'} ${hhmm(L.ferdig)} ${esc(L.tekst)}${kont}${L.ok?'':' '+esc(Object.entries(k).filter(([n,v])=>n!=='rader'&&v).map(([n,v])=>n+': '+v).join(', '))}</span>` : '<span>Ikke hentet i denne økta</span>';
  el.innerHTML=`<button id="fupd" ${API.running?'disabled':''} title="Henter nye resultater fra FIS, bygger og kjører alle kontroller. Publiserer ikke.">🔄 Hent fra FIS</button>
    <label title="Sjekker FIS selv, bare på rennedager mellom 08 og 23. Du kan fortsatt trykke knappen."><input type="checkbox" id="fauto" ${API.auto.on?'checked':''}> auto</label>
    <select id="fmin" title="Hvor ofte">${[5,10,15,30,60].map(m=>`<option value="${m}" ${m===API.auto.min?'selected':''}>${m} min</option>`).join('')}</select>
    ${stat}${ny?'<button class="ny" id="freload">🔔 Nye data klare: last inn på nytt</button>':''}`;
}
async function apiGet(){
  try{ const r=await fetch('/api/status',{cache:'no-store'}); if(!r.ok||!(r.headers.get('content-type')||'').includes('json')) throw 0; API=await r.json(); if(LOADV==null) LOADV=API.dataVersion; }catch(e){ API=null; }
  fisUI(); setTimeout(apiGet, API&&API.running?3000:30000);
}
const apiPost=(u,b)=>fetch(u,{method:'POST',headers:{'X-Alpin':'1','Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json()).then(j=>{ API=j; fisUI(); setTimeout(apiGet,2500); });
document.getElementById('fis').addEventListener('click',e=>{
  if(e.target.id==='fupd') apiPost('/api/oppdater');
  if(e.target.id==='freload') location.reload();
});
document.getElementById('fis').addEventListener('change',e=>{
  if(e.target.id==='fauto'||e.target.id==='fmin') apiPost('/api/auto',{on:document.getElementById('fauto').checked,min:+document.getElementById('fmin').value});
});
apiGet();
render();
</script>
</body>
